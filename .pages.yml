content:
  - name: landing
    label: "Landing Page"
    type: file
    path: "content/pages/landing.md"
    fields:
      # =============================
      # Section 1: Hero Section
      # =============================
      - name: hero
        label: Hero Section
        type: object
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: description, label: Description, type: text, required: true }
          - { name: backgroundImage, label: Background Image, type: image, required: false }
          - name: cta
            label: CTA Button (optional)
            type: object
            required: false
            fields:
              - { name: label, label: Button Label, type: string }
              - { name: url, label: Redirect URL, type: string }

      # =============================
      # Section 2: Features (list)
      # =============================
      - name: features
        label: Features Section
        type: list
        labelField: text
        fields:
          - { name: text, label: Title Text, type: string, required: true }
          - { name: description, label: Description, type: text, required: true }
          - { name: image, label: Image, type: image, required: false }
          - name: cta
            label: CTA Button (optional)
            type: object
            required: false
            fields:
              - { name: label, label: Button Label, type: string }
              - { name: url, label: Redirect URL, type: string }

      # =============================
      # Section 3: Footer Links (list)
      # =============================
      - name: footer
        label: Footer Links
        type: list
        labelField: label
        fields:
          - { name: label, label: Link Label, type: string, required: true }
          - { name: url, label: Link URL, type: string, required: true }
