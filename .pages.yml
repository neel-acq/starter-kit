media:
  input: public/assets
  output: /assets
  categories: ["image"]

content:
  # Homepage with all sections inside
  - name: homepage
    label: Homepage
    type: file
    path: content/pages/homepage.md
    fields:
      # ================================
      # Hero Section
      # ================================
      - name: hero
        label: Hero Section
        type: object
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: description, label: Description, type: text }
          - { name: backgroundImage, label: Background Image, type: image }
          - name: cta
            label: CTA Button
            type: object
            fields:
              - { name: label, label: Button Label, type: string }
              - { name: url, label: Redirect URL, type: string }

      # ================================
      # Features Section (list = collection style inside homepage)
      # ================================
      - name: features
    label: Features
    type: collection
    path: content/features
    view:
      fields: [title, description]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: text }
      - { name: image, label: Image, type: image }
      - name: cta
        label: CTA Button
        type: object
        fields:
          - { name: label, label: Button Label, type: string }
          - { name: url, label: Redirect URL, type: string }

      # ================================
      # Blogs Section (repeatable posts)
      # ================================
      - name: blogs
        label: Blogs Section
        type: list
        itemLabel: title
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: excerpt, label: Excerpt, type: string }
          - { name: coverImage, label: Cover Image, type: image }
          - { name: date, label: Date, type: date, options: { format: "yyyy-MM-dd" } }
          - { name: body, label: Body, type: rich-text }

      # ================================
      # Subscription Section
      # ================================
      - name: subscription
        label: Subscription Section
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: description, label: Description, type: text }
          - { name: buttonLabel, label: Button Label, type: string }

      # ================================
      # Footer Section
      # ================================
      - name: footer
        label: Footer Section
        type: object
        fields:
          - { name: copyright, label: Copyright, type: string }
          - name: links
            label: Footer Links
            type: list
            itemLabel: label
            fields:
              - { name: label, label: Label, type: string }
              - { name: url, label: URL, type: string }
