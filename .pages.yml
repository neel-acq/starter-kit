content:
  - name: landing
    label: "Landing Page"
    type: file
    path: "content/pages/landing.md"
    fields:
      # Hero Section
      - name: hero
        label: "Hero Section"
        type: object
        fields:
          - name: title
            label: Title
            type: string
          - name: description
            label: Description
            type: text
          - name: backgroundImage
            label: Background Image (optional)
            type: image
            required: false
          - name: cta
            label: CTA Button (optional)
            type: object
            required: false
            fields:
              - name: label
                label: Button Label
                type: string
              - name: url
                label: Redirect URL
                type: string

      # Features Section (list)
      - name: features
        label: "Features Section"
        type: list
        labelField: text # 👈 show "text" as the label in UI
        fields:
          - name: text
            label: Title Text
            type: string
          - name: description
            label: Description
            type: text
          - name: image
            label: Image (optional)
            type: image
            required: false
          - name: cta
            label: CTA Button (optional)
            type: object
            required: false
            fields:
              - name: label
                label: Button Label
                type: string
              - name: url
                label: Redirect URL
                type: string

      # Footer Links (list)
      - name: footer
        label: "Footer Links"
        type: list
        labelField: label # 👈 show "label" as the label in UI
        fields:
          - name: label
            label: Link Label
            type: string
          - name: url
            label: Link URL
            type: string
