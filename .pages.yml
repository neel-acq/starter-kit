media:
  input: public/assets
  output: /assets
  categories: ["image"]

content:
  # Hero Section (single file)
  - name: hero
    label: Hero Section
    type: file
    path: content/pages/hero.md
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: text }
      - { name: backgroundImage, label: Background Image, type: image }
      - name: cta
        label: CTA Button
        type: object
        fields:
          - { name: label, label: Button Label, type: string }
          - { name: url, label: Redirect URL, type: string }

  # Features Section (collection = multiple items, todo-like)
  - name: features
    label: Features
    type: collection
    path: content/features
    view:
      fields: [title, description]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: text }
      - { name: image, label: Image, type: image }
      - name: cta
        label: CTA Button
        type: object
        fields:
          - { name: label, label: Button Label, type: string }
          - { name: url, label: Redirect URL, type: string }

  # Blogs (collection = multiple items)
  - name: blogs
    label: Blogs
    type: collection
    path: content/blogs
    view:
      fields: [title, date]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: excerpt, label: Excerpt, type: string }
      - { name: coverImage, label: Cover Image, type: image }
      - {
          name: date,
          label: Date,
          type: date,
          options: { format: "yyyy-MM-dd" },
        }
      - { name: body, label: Body, type: rich-text }

  # Subscription Section (single file)
  - name: subscription
    label: Subscription
    type: file
    path: content/pages/subscription.md
    fields:
      - { name: title, label: Title, type: string }
      - { name: description, label: Description, type: text }
      - { name: buttonLabel, label: Button Label, type: string }

  # Footer Section (single file, with repeatable links)
  - name: footer
    label: Footer
    type: collection
    path: content/footer
    view:
      fields: [label, url]
    fields:
      - { name: label, label: Label, type: string, required: true }
      - { name: url, label: URL, type: string, required: true }
