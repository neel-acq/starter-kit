content:
  - name: landing
    label: "Landing Page"
    type: file
    path: "content/pages/landing.md"
    fields:
      # =============================
      # Section 1: Hero Section
      # =============================
      - name: hero
        label: "Hero Section"
        type: object
        fields:
          - name: title
            label: Title
            type: string
          - name: description
            label: Description
            type: text
          - name: backgroundImage
            label: Background Image (optional)
            type: image
            required: false
          - name: cta
            label: CTA Button (optional)
            type: object
            required: false
            fields:
              - name: label
                label: Button Label
                type: string
              - name: url
                label: Redirect URL
                type: string

      # =============================
      # Section 2: Features (Multiple)
      # =============================
      - name: features
        label: "Features Section"
        type: list
        fields:
          - name: text
            label: Title Text
            type: string
          - name: description
            label: Description
            type: text
          - name: image
            label: Image (optional)
            type: image
            required: false
          - name: cta
            label: CTA Button (optional)
            type: object
            required: false
            fields:
              - name: label
                label: Button Label
                type: string
              - name: url
                label: Redirect URL
                type: string

      # =============================
      # Section 3: Footer Links (Multiple)
      # =============================
      - name: footer
        label: "Footer Links"
        type: list
        fields:
          - name: label
            label: Link Label
            type: string
          - name: url
            label: Link URL
            type: string
