- name: home
  label: Home Page
  path: content/pages/home.md
  type: file
  fields:
    # =============================
    # Hero Section
    # =============================
    - name: hero
      label: Hero Section
      type: object
      fields:
        - name: title
          label: Title
          type: string
          required: true
        - name: description
          label: Description
          type: text
        - name: backgroundImage
          label: Background Image
          type: image
        - name: cta
          label: CTA Button
          type: object
          fields:
            - name: label
              label: Button Label
              type: string
            - name: url
              label: Redirect URL
              type: string

    # =============================
    # Features Section
    # =============================
    - name: features
      label: Features Section
      type: list
      itemLabel: title
      fields:
        - name: title
          label: Title
          type: string
          required: true
        - name: description
          label: Description
          type: text
        - name: image
          label: Image
          type: image
        - name: cta
          label: CTA Button
          type: object
          fields:
            - name: label
              label: Button Label
              type: string
            - name: url
              label: Redirect URL
              type: string

    # =============================
    # Testimonials Section
    # =============================
    - name: testimonials
      label: Testimonials
      type: list
      itemLabel: name
      fields:
        - name: name
          label: Name
          type: string
          required: true
        - name: role
          label: Role
          type: string
        - name: feedback
          label: Feedback
          type: text
        - name: avatar
          label: Avatar
          type: image
